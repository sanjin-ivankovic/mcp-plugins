[project]
name = "homelab-mcp"
version = "0.5.4"
description = "Read-only MCP server for the homelab: PVE, PBS, Unraid, Technitium, Pi-hole, Komodo, Semaphore, drift"
requires-python = ">=3.12"
dependencies = [
  "mcp==2.3.0",
  "httpx==0.28.1",
]

[project.scripts]
homelab-mcp = "homelab_mcp.server:main"

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "respx==0.23.1",
  "ruff==0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S603"]  # subprocess with a fixed argv list is the drift design

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
