[project]
name = "homelab-mcp"
version = "1.2.0"
description = "MCP servers for the homelab: a read-only view (PVE, PBS, Unraid, Technitium, Pi-hole, Komodo, Semaphore, Traefik, Alertmanager, Vault metadata, drift), SearXNG search, OpenGist, the Docmost handbook and SilverBullet scratch pages"
requires-python = ">=3.15"
dependencies = [
  "mcp==2.3.0",
  "httpx==0.28.1",
  "regex==2026.11.7",
  "trafilatura==2.3.1",
]

[project.scripts]
homelab-mcp = "homelab_mcp.server:main"
opengist-mcp = "homelab_mcp.opengist:main"
docmost-mcp = "homelab_mcp.docmost:main"
searxng-mcp = "homelab_mcp.searxng:main"
silverbullet-mcp = "homelab_mcp.silverbullet:main"

[dependency-groups]
dev = [
  "pyright[nodejs]==1.1.414",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "respx==0.23.1",
  "ruff==0.17.4",
]

[tool.uv]
# Every lock takes only files uploaded at least 14 days ago: Renovate's
# minimumReleaseAge soaks direct pins, and this soaks the transitive ones that
# lock-file maintenance would otherwise pull in on their release day. uv.lock
# stores the span (exclude-newer-span), so the lock does not go stale.
exclude-newer = "14 days"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/homelab_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["homelab_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Just under the measured branch coverage; raise it as coverage grows.
fail_under = 90

# Strict: backend JSON is Any by nature, so it goes through common.obj() and
# common.arr(), which also turn a wrong JSON type into an empty value.
[tool.pyright]
include = ["src"]
pythonVersion = "3.15"
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = ["S603"]  # subprocess with a fixed argv list is the drift design

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
